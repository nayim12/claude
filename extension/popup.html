<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --accent:#1f6feb; --fg:#1f2328; --muted:#59636e; --bg:#ffffff; --line:#d8dee8; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6edf3; --muted:#9198a1; --bg:#161b22; --line:#30363d; } }
  body { margin:0; width:290px; font:13px "Segoe UI", system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  header img { width:28px; height:28px; }
  header b { font-size:14px; }
  #state { font-size:12px; color:var(--muted); }
  #state.ok::before { content:"● "; color:#2da44e; }
  #state.bad::before { content:"● "; color:#cf222e; }
  section { padding:10px 14px; border-bottom:1px solid var(--line); }
  label.row { display:flex; justify-content:space-between; align-items:center; margin:6px 0; gap:8px; }
  input[type=number] { width:70px; }
  input[type=text] { width:100%; box-sizing:border-box; margin-top:4px; }
  button { width:100%; padding:7px; margin:4px 0; border:1px solid var(--line); border-radius:6px;
           background:transparent; color:var(--fg); cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  small { color:var(--muted); }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <div><b>SwiftGet</b><div id="state">Checking…</div></div>
</header>
<section>
  <label class="row">Capture downloads <input type="checkbox" id="enabled"></label>
  <label class="row">Capture every file type <input type="checkbox" id="captureAllTypes"></label>
  <label class="row">Ignore files smaller than (KB) <input type="number" id="minSizeKB" min="0" step="100"></label>
  <label>Never capture these extensions
    <input type="text" id="skipExts" placeholder="e.g. pdf, jpg">
  </label>
</section>
<section>
  <button class="primary" id="grab">Download all links on this page</button>
  <button id="open">Open SwiftGet</button>
  <small>Tip: right-click any link or video and choose “Download with SwiftGet”.</small>
</section>
<script src="popup.js"></script>
</body>
</html>
